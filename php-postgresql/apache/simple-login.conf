<VirtualHost *:80>
    ServerName simple-login.local
    DocumentRoot "/absolute/path/to/simple-login-system/php-postgresql/public"

    <Directory "/absolute/path/to/simple-login-system/php-postgresql/public">
        Options -Indexes
        AllowOverride None
        Require all granted

        DirectoryIndex index.php
    </Directory>

    ErrorLog "${APACHE_LOG_DIR}/simple-login-error.log"
    CustomLog "${APACHE_LOG_DIR}/simple-login-access.log" combined
</VirtualHost>
